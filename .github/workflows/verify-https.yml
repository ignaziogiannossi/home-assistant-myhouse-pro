name: Verify vendor HTTPS
on:
  push:
    branches: [verify-vendor-https]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe vendor API without credentials or thermostat commands
        run: |
          python - <<'PY'
          import concurrent.futures, json, ssl, urllib.request, urllib.error
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          urls = [
              "https://www.mycomforthouse.com/iotfront/api.php/User/login",
              "https://www.mycomforthouse.com:8080/iotfront/api.php/User/login",
              "https://mycomforthouse.com/iotfront/api.php/User/login",
              "http://www.mycomforthouse.com:8080/iotfront/api.php/User/login",
          ]
          def probe(url):
              # Empty request: no account identifiers, passwords or device IDs.
              opener = urllib.request.build_opener(NoRedirect(), urllib.request.HTTPSHandler(context=ssl.create_default_context()))
              try:
                  response = opener.open(urllib.request.Request(url, data=b"", method="POST"), timeout=20)
                  data = response.read(512)
                  return {"url": url, "status": response.status, "content_type": response.headers.get("Content-Type"), "response_sample": data.decode("utf-8", "replace")}
              except Exception as exc:
                  return {"url": url, "error": str(exc)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              for result in pool.map(probe, urls):
                  print(json.dumps(result))
          PY
      - uses: actions/checkout@v4
      - name: Install protocol test dependencies
        run: python -m pip install -r requirements-test.txt aiohttp
      - name: Verify encrypted API login rejection over TLS
        run: |
          python - <<'PY'
          import asyncio, importlib.util, json, ssl, socket, sys
          from pathlib import Path
          import aiohttp
          spec = importlib.util.spec_from_file_location("api", Path("custom_components/myhouse_pro/api.py"))
          api = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = api
          spec.loader.exec_module(api)
          with socket.create_connection(("www.mycomforthouse.com", 443), timeout=20) as sock:
              with ssl.create_default_context().wrap_socket(sock, server_hostname="www.mycomforthouse.com") as conn:
                  cert = conn.getpeercert()
                  print(json.dumps({"tls": conn.version(), "subject": cert.get("subject"), "issuer": cert.get("issuer"), "expires": cert.get("notAfter"), "san": cert.get("subjectAltName")}))
          async def main():
              async with aiohttp.ClientSession(timeout=aiohttp.ClientTimeout(total=20)) as session:
                  for base in ("https://www.mycomforthouse.com/iotfront/api.php/", "http://www.mycomforthouse.com:8080/iotfront/api.php/"):
                      body = {key: api.encrypt(value) for key, value in {"name": "tls-probe@example.invalid", "password": "not-a-real-account", "language": "2"}.items()}
                      try:
                          async with session.post(base + "User/login?", data=body, allow_redirects=False, ssl=True) as response:
                              raw = await response.content.read(4096)
                              try:
                                  decoded = json.loads(api.decrypt(raw))
                              except Exception:
                                  decoded = raw.decode("utf-8", "replace")[:500]
                              print(json.dumps({"base": base, "status": response.status, "location": response.headers.get("Location"), "response": decoded}))
                      except Exception as exc:
                          print(json.dumps({"base": base, "error": str(exc)}))
          asyncio.run(main())
          PY
